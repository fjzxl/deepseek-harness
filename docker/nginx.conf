# dsh web 与 deck 预览按产品安全设计只绑容器内 127.0.0.1;本配置同样只听回环,
# 只做路径分流——对外入口是 dsh-passwords 认证网关(0.0.0.0:8080,反代到这里)。
# Loopback-only path splitter: dsh web and the deck preview bind 127.0.0.1 by
# design; the dsh-passwords auth gateway is the single external listener.
#
# /             → dsh web UI(127.0.0.1:3080)
# /ppt-studio/  → deck 预览服务(127.0.0.1:3170),与
#                 PPT_STUDIO_PREVIEW_BASE_URL=http://<宿主>:<端口>/ppt-studio 配对
server {
    listen 127.0.0.1:__NGINX_PROXY_PORT__;
    server_name _;

    # deck 预览产物可能较大
    client_max_body_size 32m;

    location /ppt-studio/ {
        proxy_pass http://127.0.0.1:3170/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        # 必须用 $http_host(保留端口):dsh-auth Cookie 名按 authority(含端口)派生,
        # $host 会剥掉端口导致 dsh web 期望的 Cookie 名与网关注入的不一致,全站 401
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # web UI 的会话流走 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
