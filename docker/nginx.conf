# dsh 镜像唯一对外监听:dsh web 与 deck 预览都按产品安全设计只绑容器内
# 127.0.0.1,由这里把它们暴露在一个端口上,供前置网关转发。
# The image's single external listener: dsh web and the deck preview bind the
# in-container loopback by design; this exposes both on one port for a gateway.
#
# /             → dsh web UI(127.0.0.1:3080)
# /ppt-studio/  → deck 预览服务(127.0.0.1:3170),与
#                 PPT_STUDIO_PREVIEW_BASE_URL=https://<网关>:<端口>/ppt-studio 配对
server {
    listen __NGINX_PROXY_PORT__;
    server_name _;

    # deck 预览产物可能较大
    client_max_body_size 32m;

    location /ppt-studio/ {
        proxy_pass http://127.0.0.1:3170/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # web UI 的会话流走 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
